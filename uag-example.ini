# Sample INI for uag_deploy.py (format compatible with the official uagdeploy.ps1)
# Note: do NOT put the vCenter password into target= - pass --vcenter-password instead

[General]
name=UAG-HZN-01-NEW
source=C:\UAG\euc-unified-access-gateway-25.12.1.0-22302759284_OVF10.ova
target=vi://administrator@vsphere.local@vcenter.example.com/Datacenter/host/CLUSTER-01
ds=DATASTORE-01
folder=DMZ/UAG
diskMode=thin
deploymentOption=onenic
netInternet=DMZ-Network
netManagementNetwork=DMZ-Network
netBackendNetwork=DMZ-Network
ip0=10.0.0.50
netmask0=255.255.255.0
defaultGateway=10.0.0.1
dns=10.0.1.10 10.0.1.11
dnsSearch=example.com
uagName=UAG-HZN-01
ceipEnabled=false
sshEnabled=false
honorCipherOrder=true

# Minimal deployment: you can omit the [Horizon] section and import the
# configuration after the deployment via "uag_migrate.py import"
# (recommended approach).
[Horizon]
proxyDestinationUrl=https://horizon-cs.example.com
proxyDestinationUrlThumbprints=sha256=AB:CD:EF:...
blastExternalUrl=https://uag.example.com:443
pcoipExternalUrl=203.0.113.10:4172
tunnelExternalUrl=https://uag.example.com:443

# TLS certificate at deploy time (as in the official uagdeploy.ps1):
# [SSLCert]
# pfxCerts=C:\UAG\certs\uag.example.com.pfx
# (you will be prompted for the PFX password, or pass --pfx-password)
# PEM alternative (the key MUST be PKCS#1 - BEGIN RSA PRIVATE KEY):
# pemCerts=C:\UAG\certs\chain.pem
# pemPrivKey=C:\UAG\certs\key_pkcs1.pem
